spring.application.name=medora-api
server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=medora

spring.flyway.enabled=true
spring.flyway.default-schema=public
spring.flyway.locations=classpath:db/migration

spring.sql.init.mode=never

#session
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Explicit MVP policies; review before real clinic use.
medora.facility-zone=${MEDORA_FACILITY_ZONE:Asia/Ho_Chi_Minh}
medora.walk-in-enabled=${MEDORA_WALK_IN_ENABLED:true}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
medora.storage.driver=${MEDORA_STORAGE_DRIVER:filesystem}
medora.storage.path=${MEDORA_STORAGE_PATH:./data/attachments}
medora.storage.s3.endpoint=${MEDORA_S3_ENDPOINT:}
medora.storage.s3.region=${MEDORA_S3_REGION:us-east-1}
medora.storage.s3.bucket=${MEDORA_S3_BUCKET:medora-private}
medora.storage.s3.access-key=${MEDORA_S3_ACCESS_KEY:}
medora.storage.s3.secret-key=${MEDORA_S3_SECRET_KEY:}
